<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 28a - Game kiểm tra tốc độ nâng cao</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            color: #e0e0e0;
        }

        .container {
            background-color: #1e1e2f;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #2a2a40;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 22px;
        }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 700px;
            margin: 0 auto 15px auto;
            font-size: 15px;
            font-weight: bold;
        }

        .stat-box {
            background-color: #2b2b40;
            padding: 8px 10px;
            border-radius: 8px;
            color: #ffffff;
            border: 1px solid #3d3d5c;
        }

        .stat-box span {
            color: #2ed573;
        }

        /* Khu vực chơi #arena kích thước 700px x 450px */
        #arena {
            width: 700px;
            height: 450px;
            background-color: #0f0f1a;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            margin: 0 auto 15px auto;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
            border: 2px solid #4a4a75;
            cursor: crosshair;
        }

        /* Các loại mục tiêu */
        .target {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
            animation: fadeIn 0.2s ease-out forwards;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            user-select: none;
        }

        /* Mục tiêu chuẩn (Green) */
        .target.green {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #2ed573, #26af5f);
            border: 2px solid #fff;
        }

        /* Mục tiêu bẫy/phạt (Red) */
        .target.red {
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #ff4757, #ff6b81);
            border: 2px solid #fff;
        }

        /* Mục tiêu biến mất nhanh (Gold) */
        .target.gold {
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, #ffa502, #eccc68);
            border: 2px solid #fff;
            animation: fadeIn 0.2s ease-out forwards, shrinkAndFade var(--duration) linear forwards;
        }

        @keyframes fadeIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes shrinkAndFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.2); opacity: 0.3; }
        }

        .controls {
            margin-top: 10px;
        }

        button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #2ed573;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #26af5f;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #4b4b66;
            cursor: not-allowed;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            z-index: 10;
        }

        .warning-msg {
            color: #ff4757;
            font-size: 14px;
            height: 20px;
            margin-bottom: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Game Kiểm Tra Tốc Độ Phản Xạ (Nâng Cao)</h1>

        <div class="stats-panel">
            <div class="stat-box">Điểm: <span id="score">0</span></div>
            <div class="stat-box">Mạng: <span id="lives">3</span></div>
            <div class="stat-box">Cấp độ: <span id="level">1</span></div>
            <div class="stat-box">Thời gian: <span id="timer">30</span>s</div>
        </div>

        <div class="warning-msg" id="warning"></div>

        <!-- Khu vực chơi #arena -->
        <div id="arena"></div>

        <div class="controls">
            <button id="start-btn" onclick="startGame()">Bắt đầu trò chơi</button>
        </div>
    </div>

    <script>
        const arena = document.getElementById('arena');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const levelDisplay = document.getElementById('level');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const warningDisplay = document.getElementById('warning');

        let score = 0;
        let lives = 3;
        let level = 1;
        let timeLeft = 30;
        let isPlaying = false;

        let gameInterval = null;
        let spawnInterval = null;
        let activeTargets = []; // Lưu danh sách các mục tiêu đang hiển thị để tránh chồng lấn
        let lockoutTimer = null;
        let isLocked = false;

        const ARENA_WIDTH = 700;
        const ARENA_HEIGHT = 450;

        // Mã hóa / Giải mã điểm cao lưu localStorage (Base64 obfuscation)
        function getHighScore() {
            try {
                const encoded = localStorage.getItem('high_score_encoded');
                if (!encoded) return 0;
                return parseInt(atob(encoded)) || 0;
            } catch (e) {
                return 0;
            }
        }

        function saveHighScore(newScore) {
            const currentHigh = getHighScore();
            if (newScore > currentHigh) {
                try {
                    const encoded = btoa(newScore.toString());
                    localStorage.setItem('high_score_encoded', encoded);
                } catch (e) {}
            }
        }

        // Kiểm tra chống chồng lấn tọa độ
        function getRandomPosition(size) {
            const maxLeft = ARENA_WIDTH - size;
            const maxTop = ARENA_HEIGHT - size;
            let attempts = 0;

            while (attempts < 30) {
                const left = Math.floor(Math.random() * maxLeft);
                const top = Math.floor(Math.random() * maxTop);
                let overlap = false;

                for (let t of activeTargets) {
                    // Khoảng cách tâm hoặc bounding box kiểm tra giao nhau có khoảng đệm
                    const dx = t.left - left;
                    const dy = t.top - top;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < size + 15) {
                        overlap = true;
                        break;
                    }
                }

                if (!overlap) {
                    return { left, top };
                }
                attempts++;
            }
            // Fallback ngẫu nhiên nếu tìm quá lâu
            return {
                left: Math.floor(Math.random() * maxLeft),
                top: Math.floor(Math.random() * maxTop)
            };
        }

        // Sinh mục tiêu ngẫu nhiên (Green, Red, Gold)
        function spawnTarget() {
            if (!isPlaying) return;

            // Xác suất xuất hiện: 60% Green, 25% Red, 15% Gold
            const rand = Math.random();
            let type = 'green';
            let size = 45;
            if (rand > 0.6 && rand <= 0.85) {
                type = 'red';
            } else if (rand > 0.85) {
                type = 'gold';
                size = 35;
            }

            const pos = getRandomPosition(size);
            const targetEl = document.createElement('div');
            targetEl.className = `target ${type}`;
            targetEl.style.left = pos.left + 'px';
            targetEl.style.top = pos.top + 'px';

            const targetData = {
                element: targetEl,
                left: pos.left,
                top: pos.top,
                type: type,
                timeoutId: null
            };

            // Nếu là Gold, có thời gian tồn tại 1.5s (áp dụng hệ số cấp độ thu nhỏ thời gian)
            let duration = 1500 * Math.pow(0.85, level - 1);
            if (type === 'gold') {
                targetEl.style.setProperty('--duration', (duration / 1000) + 's');
                targetData.timeoutId = setTimeout(() => {
                    removeTarget(targetData);
                    // Bỏ lỡ Gold -> mất 1 mạng
                    lives--;
                    updateUI();
                    if (lives <= 0) endGame();
                }, duration);
            } else {
                // Mục tiêu thường/bẫy tự biến mất sau 2.5s nếu không click
                targetData.timeoutId = setTimeout(() => {
                    removeTarget(targetData);
                }, 2500 * Math.pow(0.85, level - 1));
            }

            // Xử lý sự kiện click
            targetEl.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!isPlaying || isLocked) return;

                clearTimeout(targetData.timeoutId);
                removeTarget(targetData);

                if (type === 'green') {
                    score += 1;
                } else if (type === 'red') {
                    score = Math.max(0, score - 2);
                    lives--;
                } else if (type === 'gold') {
                    score += 3;
                    timeLeft += 2; // cộng thêm 2 giây
                }

                checkLevelUp();
                updateUI();
                if (lives <= 0) endGame();
            });

            activeTargets.push(targetData);
            arena.appendChild(targetEl);
        }

        function removeTarget(targetData) {
            const index = activeTargets.indexOf(targetData);
            if (index > -1) {
                activeTargets.splice(index, 1);
            }
            if (targetData.element && targetData.element.parentNode) {
                targetData.element.parentNode.removeChild(targetData.element);
            }
        }

        // Tăng cấp độ mỗi 10 điểm
        function checkLevelUp() {
            const newLevel = Math.floor(score / 10) + 1;
            if (newLevel !== level) {
                level = newLevel;
                // Reset lại tần suất xuất hiện mục tiêu nhanh hơn 15%
                resetSpawnInterval();
            }
        }

        function resetSpawnInterval() {
            if (spawnInterval) clearInterval(spawnInterval);
            let intervalTime = Math.max(400, 1000 * Math.pow(0.85, level - 1));
            spawnInterval = setInterval(spawnTarget, intervalTime);
        }

        function updateUI() {
            scoreDisplay.textContent = score;
            livesDisplay.textContent = lives;
            levelDisplay.textContent = level;
            timerDisplay.textContent = timeLeft;
        }

        // Chống Spam Click / Anti-Bot vào khoảng trống trong #arena
        arena.addEventListener('click', function(e) {
            if (!isPlaying || isLocked) return;
            // Nếu click trực tiếp vào arena (không phải trúng target)
            if (e.target === arena) {
                isLocked = true;
                warningDisplay.textContent = "Phạt: Click sai vị trí (-1 điểm, khóa 0.5s)!";
                score = Math.max(0, score - 1);
                updateUI();

                lockoutTimer = setTimeout(() => {
                    isLocked = false;
                    warningDisplay.textContent = "";
                }, 500);
            }
        });

        // Bắt đầu trò chơi
        function startGame() {
            score = 0;
            lives = 3;
            level = 1;
            timeLeft = 30;
            isPlaying = true;
            isLocked = false;

            arena.innerHTML = '';
            activeTargets = [];
            startBtn.disabled = true;
            warningDisplay.textContent = "";

            updateUI();
            spawnTarget();
            resetSpawnInterval();

            // Đếm ngược thời gian
            gameInterval = setInterval(function() {
                timeLeft--;
                updateUI();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // Kết thúc trò chơi & dọn dẹp bộ nhớ (Clear memory / Clean up)
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            if (lockoutTimer) clearTimeout(lockoutTimer);

            // Dọn dẹp toàn bộ mục tiêu đang tồn tại
            activeTargets.forEach(t => {
                if (t.timeoutId) clearTimeout(t.timeoutId);
                if (t.element && t.element.parentNode) {
                    t.element.parentNode.removeChild(t.element);
                }
            });
            activeTargets = [];
            arena.innerHTML = '';

            saveHighScore(score);
            const highScore = getHighScore();

            // Hiển thị màn hình kết thúc
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <div>HẾT GIỜ!</div>
                <div style="margin-top: 10px; font-size: 20px; color: #2ed573;">
                    Tổng điểm: ${score}
                </div>
                <div style="margin-top: 5px; font-size: 16px; color: #ffa502;">
                    Điểm cao nhất (High Score): ${highScore}
                </div>
            `;
            arena.appendChild(overlay);
            startBtn.disabled = false;
        }
    </script>
</body>
</html>
